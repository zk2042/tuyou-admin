name: Admin H5 CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-h5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - name: Verify H5 output
        run: test -s dist/index.html
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: admin-h5-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy production H5
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.TUYOU_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo '::notice::TuYou deployment key is not configured; build artifact was retained.'
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tuyou-deploy"
          chmod 600 "$HOME/.ssh/tuyou-deploy"
          printf '%s\n' '47.122.110.148 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGg9Z5NuOEdqsh5hnKSpk+p1hJDX53tWqvNHVVTPepLe' > "$HOME/.ssh/known_hosts"
          tar -czf - -C dist . | ssh -T -i "$HOME/.ssh/tuyou-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes tuyou-admin-deploy@47.122.110.148 "$GITHUB_SHA $GITHUB_RUN_NUMBER"
